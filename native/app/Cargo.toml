[package]
name = "herdr-desktop-native"
version = "0.1.0-alpha.10"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[features]
default = ["terminal"]
# The embedded terminal (src/terminal, docs/specs/terminal.md): a PTY and libghostty-vt. Needs the C library: zig 0.15.x
# builds it on the first compile (network: the crate fetches ghostty's source), or point pkg-config at an installed one.
terminal = ["dep:libghostty-vt", "dep:libghostty-vt-sys", "dep:rustix"]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
herdr-core = { path = "../core" }
async-channel = "2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde_json = "1"
unicode-width = "0.2"
log = "0.4"
libghostty-vt = { version = "0.2.2", optional = true }
libghostty-vt-sys = { version = "0.2.2", optional = true, features = ["pkg-config"] }
rustix = { version = "1", optional = true, features = ["pty", "termios", "process", "fs", "stdio"] }
similar = { version = "2", features = ["unicode"] }
streaming-iterator = "0.1"
# The highlighter (src/highlight): tree-sitter grammars with our queries, and the TextMate grammars nsh ships
# for everything else (the same syntect and two-face versions nsh-base resolves: one copy of the grammar data).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "=0.4.5", default-features = false, features = ["syntect-fancy"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.3"
tree-sitter-diff = "0.1"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"

# freedesktop notifications over the session bus: every desktop but macOS (see src/notify).
[target.'cfg(not(target_os = "macos"))'.dependencies]
zbus = "5"

# proc_pidinfo for the developer panel's memory, threads and open files (src/metrics.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"
