[package]
name = "herdr-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel = "0.5"
vte = "0.15"
unicode-width = "0.2"
unicode-segmentation = "1"
dirs = "6"
flate2 = "1"
rustix = { version = "1", features = ["process"] }
regex = "1"
fancy-regex = "0.16"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "parse"
harness = false
