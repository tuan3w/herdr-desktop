[package]
name = "herdr-core"
version = "0.1.0-alpha.9"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a question form is walked in the order its schema lists the fields (herdr-mobile's
# workspace sets it, and the `acp` path dependency used to bring it in).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
crossbeam-channel = "0.5"
vte = "0.15"
unicode-width = "0.2"
unicode-segmentation = "1"
dirs = "6"
flate2 = "1"
memchr = "2"
rustix = { version = "1", features = ["process", "fs"] }
regex = "1"
fancy-regex = "0.16"
parking_lot = "0.12"
# The palette's search (src/search): fzf-style fuzzy scoring (MPL-2.0, listed in NOTICE) and the one-character-at-a-time fold.
nucleo-matcher = "0.3"
unicode-normalization = "0.1"
# Quick open of files (src/files/quick.rs): the walk that reads .gitignore the way git does (MIT or Unlicense).
ignore = "0.4"
# Pictures for a message (src/compose): decode, orient, scale, encode again without metadata. The formats nsh itself
# reads on Linux, so the build holds one copy of each codec.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "quick"
harness = false
