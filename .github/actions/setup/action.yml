name: Set up Herdr Desktop
description: >
  System packages (Linux), nsh 0.4.0, the pinned Rust toolchain with a cache keyed on the Cargo.lock files, bun and node.
  One place, so ci.yml and release.yml build the same way on Linux and macOS.
inputs:
  cache:
    description: Names this job's Rust cache; the job ends with ./.github/actions/save-cache given the same outputs.
    required: true
outputs:
  cache-key:
    description: The exact key of this job's Rust cache, for save-cache.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: "true when the cache was restored from exactly that key, so there is nothing to save."
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: System packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # GTK and WebKitGTK dev files (nsh's Linux platform links WebKitGTK even when no web view opens), clang for
      # QuickJS, and what the AT-SPI audit and the screenshots need on a display-less runner.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev libwebkitgtk-6.0-dev clang pkg-config xvfb dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0

    - name: nsh 0.4.0
      shell: bash
      # Pinned: nsh 0.4.0 is the API the app is written for (AGENTS.md: do not upgrade unless asked). The installer
      # links nsh into ~/.local/bin on both systems. Tried three times, a minute apart: GitHub's asset host answered 504
      # twice in a row on 2026-11-09 and failed the 0.1.0-alpha.8 and alpha.9 Linux builds.
      run: |
        for attempt in 1 2 3; do
          NSH_VERSION=v0.4.0 sh -c "$(curl -fsSL --retry 3 https://nsh.dev/install.sh)" && break
          [ "$attempt" = 3 ] && exit 1
          sleep 60
        done
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/nsh" -V

    - name: Rust toolchain
      shell: bash
      # rust-toolchain.toml names the version and components; installing here keeps the first cargo call from doing it.
      run: rustup show active-toolchain || rustup toolchain install

    - name: Rust cache
      id: cache
      # Restore only: `actions/cache` saves in a post step that runs when the job succeeds, so a job that never
      # went green never filled the cache and every run recompiled everything. The job saves it itself, even after a
      # failure (`./.github/actions/save-cache`, which names the same paths). One cache per OS and job, because the
      # jobs build different things (check, the headless test runner, the GTK host, a release build) and a cache
      # saved by whichever finished first would hold only its part.
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-${{ hashFiles('native/core/Cargo.lock', 'native/app/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-

    - uses: oven-sh/setup-bun@v2

    - name: Dev tools (oxlint, oxfmt)
      shell: bash
      # `make check` runs them from node_modules; the lockfile pins the versions.
      run: bun install --frozen-lockfile

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
