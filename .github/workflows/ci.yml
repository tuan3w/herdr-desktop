name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main is verified: only a superseded pull request run is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: theme.json matches its generator
        # `make theme` only after the default theme's spec changes; a drift means someone edited one without the other.
        run: bun scripts/gen-theme.mjs && git diff --exit-code theme.json

      - name: make verify
        # nsh check, nsh test, core (fmt, clippy, tests), docs, a11y. A real GTK window needs a display and an AT-SPI bus,
        # and Xvfb has no GPU: cairo draws.
        run: dbus-run-session -- xvfb-run -a env GSK_RENDERER=cairo GTK_A11Y=atspi make verify

      - name: make package
        # The release path must keep working on every change, not only on a tag.
        run: make package

      - name: Package contents
        run: |
          tar -tzf ".scratch/dist/Herdr Desktop.tar.gz" | grep -E 'HerdrDesktop$|\.desktop$|\.png$|nsh/bundle\.nshc$'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-linux
          path: |
            .scratch/a11y/
            .scratch/shots/
          if-no-files-found: ignore

  macos:
    # Apple silicon (macos-14 is not offered to this repository any more: "configuration macos-14-arm64-us-default is not
    # supported"; macos-15 is). Intel Macs are not built: nsh 0.4.0 ships its macOS CLI and runtime for arm64 only
    # (nsh-macos-arm64.tar.gz is the one macOS asset of the v0.4.0 release).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: make verify-mac
        # nsh check, nsh test (headless: no window server is needed), core (fmt, clippy, tests of both crates), docs.
        # What Linux adds and macOS skips: the AT-SPI audit (`make a11y`), the Xvfb screenshots and the perf/cpu scripts.
        # They read Linux's accessibility bus and /proc, so a Mac has no equivalent gate yet.
        run: make verify-mac

      - name: make package
        # nsh signs the .app ad hoc (no Apple developer account): Gatekeeper wants a first right-click, Open.
        run: make package

      - name: The .app is a bundle with its executable
        run: |
          app=".scratch/dist/Herdr Desktop.app"
          ls -la "$app/Contents" "$app/Contents/MacOS"
          test -x "$app/Contents/MacOS/"*
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundle(Identifier|ShortVersionString)'
          codesign --verify --deep --strict "$app"

      - name: Zip the app (ditto keeps permissions and the signature; upload-artifact would not)
        run: ditto -c -k --keepParent ".scratch/dist/Herdr Desktop.app" Herdr-Desktop-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Herdr-Desktop-macos-arm64
          path: Herdr-Desktop-macos-arm64.zip
          retention-days: 7
          if-no-files-found: error
