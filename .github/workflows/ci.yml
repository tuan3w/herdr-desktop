name: ci

# Jobs run in parallel and none waits for another, so the wall time is the slowest job. Each restores its own Rust cache
# (./.github/actions/setup) and saves it at the end even when it failed (./.github/actions/save-cache): a cache that only
# a green run could save was never saved while the build was still being fixed, and every run compiled everything.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main is verified: only a superseded pull request run is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # ---- Linux (ubuntu-24.04): everything `make verify` runs, in four jobs ----------------------------------------------

  linux-check:
    # Types, docs, theme, and both Rust crates (fmt, clippy -D warnings, tests). The only job that lints Rust.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: linux-check
      - name: theme.json matches its generator
        # `make theme` only after the default theme's spec changes; a drift means someone edited one without the other.
        run: bun scripts/gen-theme.mjs && git diff --exit-code theme.json
      - run: make check docs core
      - uses: ./.github/actions/save-cache
        if: always()
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          hit: ${{ steps.setup.outputs.cache-hit }}

  linux-test:
    # Every TSX test, headless. The slowest Linux job: about 770 tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: linux-test
      - run: make test
      - uses: ./.github/actions/save-cache
        if: always()
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          hit: ${{ steps.setup.outputs.cache-hit }}

  linux-a11y:
    # A real GTK window per screen under Xvfb (no GPU: cairo draws), its AT-SPI tree checked for unnamed controls.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: linux-a11y
      - run: dbus-run-session -- xvfb-run -a env GSK_RENDERER=cairo GTK_A11Y=atspi make a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-linux
          path: |
            .scratch/a11y/
            .scratch/shots/
          if-no-files-found: ignore
      - uses: ./.github/actions/save-cache
        if: always()
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          hit: ${{ steps.setup.outputs.cache-hit }}

  linux-package:
    # The release path must keep working on every change, not only on a tag.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: linux-package
      - run: make package
      - name: Package contents
        run: |
          tar -tzf ".scratch/dist/Herdr Desktop.tar.gz" | grep -E 'HerdrDesktop$|\.desktop$|\.png$|nsh/bundle\.nshc$'
      - uses: ./.github/actions/save-cache
        if: always()
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          hit: ${{ steps.setup.outputs.cache-hit }}

  # ---- macOS: Apple silicon. Intel Macs are not built: nsh 0.4.0 ships its macOS CLI and runtime for arm64 only
  # (nsh-macos-arm64.tar.gz is the one macOS asset of the v0.4.0 release). macos-14 is not offered to this repository any
  # more ("configuration macos-14-arm64-us-default is not supported"); macos-15 is. -----------------------------------------

  macos-check:
    # `make verify-mac`: nsh check, both crates' fmt/clippy/tests (the cfg(target_os = "macos") Rust is only proven here),
    # docs, and a smoke subset of the TSX tests. The other 770 TSX tests are platform independent: Linux runs them. Not run:
    # the AT-SPI audit, the Xvfb screenshots and the perf/cpu scripts (Linux's accessibility bus and /proc).
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: macos-check
      - run: make verify-mac
      - uses: ./.github/actions/save-cache
        if: always()
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          hit: ${{ steps.setup.outputs.cache-hit }}

  macos-package:
    # nsh signs the .app ad hoc; scripts/sign-macos.sh then signs it with the repository's self-signed identity (secrets
    # HERDR_SIGN_P12 and HERDR_SIGN_PASSWORD), so the designated requirement is the same in every build. A pull request
    # from a fork has no secrets and keeps the ad hoc signature; the job still passes. Gatekeeper wants a first
    # right-click, Open either way (no Apple developer account: docs/MACOS.md).
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: macos-package
      - name: make package (signs the .app)
        run: make package
        env:
          HERDR_SIGN_P12: ${{ secrets.HERDR_SIGN_P12 }}
          HERDR_SIGN_PASSWORD: ${{ secrets.HERDR_SIGN_PASSWORD }}
      - name: The .app is a bundle with its executable and its signature
        env:
          HERDR_SIGN_P12: ${{ secrets.HERDR_SIGN_P12 }}
          HERDR_SIGN_PASSWORD: ${{ secrets.HERDR_SIGN_PASSWORD }}
        run: |
          app=".scratch/dist/Herdr Desktop.app"
          ls -la "$app/Contents" "$app/Contents/MacOS"
          test -x "$app/Contents/MacOS/"*
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundle(Identifier|ShortVersionString)'
          scripts/check-macos-signature.sh "$app"
      - name: Zip the app (ditto keeps permissions and the signature; upload-artifact would not)
        run: ditto -c -k --keepParent ".scratch/dist/Herdr Desktop.app" Herdr-Desktop-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Herdr-Desktop-macos-arm64
          path: Herdr-Desktop-macos-arm64.zip
          retention-days: 7
          if-no-files-found: error
      - uses: ./.github/actions/save-cache
        if: always()
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          hit: ${{ steps.setup.outputs.cache-hit }}
