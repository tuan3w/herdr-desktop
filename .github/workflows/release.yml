name: release

# A `vX.Y.Z` or `vX.Y.Z-alpha.N` (also `-beta.N`, `-rc.N`) tag publishes a release; a tag with a `-` part is a GitHub
# PRERELEASE. The versions in nsh.json and native/*/Cargo.toml must already be exactly the tag without its `v` (the release
# commit moves them together: docs/RELEASING.md), and CHANGELOG.md must have a non-empty `## [<version>]` section, which is
# the release notes (scripts/release-notes.sh; the format is in `.agents/skills/herdr-changelog/SKILL.md`).
#
# macOS (Apple silicon) only for now: Linux is paused (the owner is focusing on macOS). The Linux job below still works; it
# runs only on a manual run with `-f linux=true` and never publishes. A release therefore holds the macOS zip and SHA256SUMS,
# and `scripts/install.sh` tells a Linux user that there is no Linux build in it.
#
# Run it by hand (Actions > release > Run workflow, or `gh workflow run release.yml -f tag=v0.1.0-alpha.1`) for a DRY RUN:
# it checks, packages, signs, zips and checksums, and keeps the files as workflow artifacts, but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag this build is a dry run of (vX.Y.Z or vX.Y.Z-alpha.N). Nothing is published."
        required: true
        default: "v0.1.0-alpha.1"
      linux:
        description: "Also build the Linux package (paused: not part of a release)."
        type: boolean
        default: false

concurrency:
  # A release is never cancelled half-way.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NSH_VERSION: v0.4.0
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTUP_SELF_UPDATE: disable

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag, nsh.json and the crates name one version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::'$TAG' is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"; exit 1; }
          version="${TAG#v}"
          nsh_version="$(jq -r .version nsh.json)"
          [ "$nsh_version" = "$version" ] || { echo "::error::tag $TAG but nsh.json says $nsh_version"; exit 1; }
          for toml in native/*/Cargo.toml; do
            crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$toml" | head -1)"
            [ "$crate_version" = "$version" ] || { echo "::error::tag $TAG but $toml says $crate_version"; exit 1; }
          done
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          { echo "tag=$TAG"; echo "version=$version"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

      - name: The release notes are the CHANGELOG section of this version (and follow its format)
        # A tag without a non-empty section fails here, before anything is built (scripts/release-notes.sh).
        run: |
          scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md
          node scripts/check-changelog.mjs "${{ steps.version.outputs.version }}"
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: release-notes.md
          retention-days: 7

  build-macos:
    name: build macos-arm64
    needs: prepare
    # macos-14 is refused for this repository; macos-15 runs. Apple silicon only: nsh 0.4.0 has no Intel runtime.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # A pre-release (a tag with a `-`: alpha, beta, rc) ships what the push to main already packaged in ci.yml; its own run
      # builds and packages only. A stable release also runs `make verify-mac` (check, both crates' fmt/clippy/tests, docs,
      # the smoke subset of the TSX tests; the whole suite is tests.yml).
      - uses: oven-sh/setup-bun@v2
        if: needs.prepare.outputs.prerelease != 'true'
      - name: Dev tools (oxlint, oxfmt)
        if: needs.prepare.outputs.prerelease != 'true'
        run: bun install --frozen-lockfile

      - name: Where nsh goes
        run: echo "NSH_INSTALL_DIR=$RUNNER_TEMP/nsh" >> "$GITHUB_ENV"
      - name: nsh from the cache
        id: nsh-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_VERSION }}
      - name: nsh install (cache miss only)
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - name: nsh on the PATH
        run: |
          echo "$NSH_INSTALL_DIR/bin" >> "$GITHUB_PATH"
          "$NSH_INSTALL_DIR/bin/nsh" -V
      - name: Rust toolchain of rust-toolchain.toml, minimal
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          components=()
          [ "$PRERELEASE" = true ] || components=(--component rustfmt --component clippy)
          rustup toolchain install "$channel" --profile minimal "${components[@]}" --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      # Restore only, with the keys of ci.yml's macos-package: a tag can read what main saved, and cannot save for main.
      - name: Cargo registry and target/ from main's cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/core/Cargo.lock', 'native/app/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('native/**') }}
          restore-keys: |
            package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/core/Cargo.lock', 'native/app/Cargo.lock', 'rust-toolchain.toml') }}-
            package-${{ runner.os }}-${{ runner.arch }}-
      - name: Files that did not change keep the age of the cache
        run: scripts/ci-mtimes.sh before

      - name: make verify-mac (stable releases only)
        if: needs.prepare.outputs.prerelease != 'true'
        run: make verify-mac

      - name: The release is signed with our identity or not built
        env:
          HERDR_SIGN_P12: ${{ secrets.HERDR_SIGN_P12 }}
        run: '[ -n "$HERDR_SIGN_P12" ] || { echo "::error::secrets HERDR_SIGN_P12 and HERDR_SIGN_PASSWORD are missing: a release must not fall back to an ad hoc signature"; exit 1; }'

      - name: make package (nsh package, then scripts/sign-macos.sh)
        run: make package
        env:
          HERDR_SIGN_P12: ${{ secrets.HERDR_SIGN_P12 }}
          HERDR_SIGN_PASSWORD: ${{ secrets.HERDR_SIGN_PASSWORD }}

      - name: Check the signature, zip the app
        env:
          HERDR_SIGN_P12: ${{ secrets.HERDR_SIGN_P12 }}
          HERDR_SIGN_PASSWORD: ${{ secrets.HERDR_SIGN_PASSWORD }}
        run: |
          app=".scratch/dist/Herdr Desktop.app"
          test -x "$app/Contents/MacOS/"*
          scripts/check-macos-signature.sh "$app"
          name="Herdr-Desktop-${{ needs.prepare.outputs.version }}-macos-arm64.zip"
          mkdir -p release
          # ditto keeps permissions, symlinks and the signature; `zip` would not.
          ditto -c -k --keepParent "$app" "release/$name"
          ls -l release
          # What the publish job checksums too; a dry run ends here, so the checksums are proven here.
          (cd release && shasum -a 256 Herdr-Desktop-* | tee SHA256SUMS && shasum -a 256 -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: release/*
          retention-days: 14
          if-no-files-found: error

  build-linux:
    # Paused (docs/RELEASING.md, "Linux"): a manual run with `linux: true` only, never part of a published release. The
    # steps are the ones that built the Linux archive of 0.1.0-alpha.1 to .3.
    name: build linux-x86_64 (paused)
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: release
      - name: make verify (a real GTK window under Xvfb, with the AT-SPI audit)
        if: needs.prepare.outputs.prerelease != 'true'
        run: dbus-run-session -- xvfb-run -a env GSK_RENDERER=cairo GTK_A11Y=atspi make verify
      - name: make package
        run: make package
      - name: Name the Linux tarball
        run: |
          name="Herdr-Desktop-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz"
          tar -tzf ".scratch/dist/Herdr Desktop.tar.gz" | grep -E 'HerdrDesktop$|\.desktop$|\.png$|nsh/bundle\.nshc$'
          mkdir -p release
          cp ".scratch/dist/Herdr Desktop.tar.gz" "release/$name"
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: release/*
          retention-days: 14
          if-no-files-found: error
      - uses: ./.github/actions/save-cache
        if: always()
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          hit: ${{ steps.setup.outputs.cache-hit }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-linux
          path: |
            .scratch/a11y/
            .scratch/shots/
          if-no-files-found: ignore

  publish:
    # Only a pushed tag publishes; a manual run stops after the artifacts.
    if: github.event_name == 'push'
    needs: [prepare, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: notes

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: |
          sha256sum Herdr-Desktop-* > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "${{ needs.prepare.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "${{ needs.prepare.outputs.tag }}" release/* \
            --title "Herdr Desktop ${{ needs.prepare.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag "${flags[@]}"
