[profile.dev]
debug = 0
# The incremental cache grew to 2-4 GB on a disk that is nearly full (a linker failed for lack of space on 2026-11-08);
# a clean rebuild costs a little time, the cache costs the build.
incremental = false

[build]
target-dir = "target"

# A foreign `ar` earlier in PATH on some developer machines breaks cc-rs
# (`ar cq` fails); pin binutils' archiver.
[env]
AR = "/usr/bin/ar"

# nsh 0.4.0's GTK backend makes no nsh view a Tab stop, so Tab reaches only text fields (`docs/ACCESSIBILITY.md`).
# `vendor/nsh-platform-linux` is that crate with nsh main's `key_focus.rs` backported; see `vendor/README.md`.
[patch.crates-io]
nsh-platform-linux = { path = "vendor/nsh-platform-linux" }
